services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Credenciais de desenvolvimento/teste (usuário: sa). Não use em produção.
      MSSQL_SA_PASSWORD: Order@Acc2026!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Cria o banco e aplica o esquema (database/*.sql) e termina. Os scripts são idempotentes: pode rodar quantas vezes quiser.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: Order@Acc2026!
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -i /scripts/01-create-database.sql
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -d OrderAccumulator -i /scripts/02-schema.sql
        echo "Banco OrderAccumulator pronto."
    restart: "no"

  # Broker Kafka de um nó só (KRaft, sem ZooKeeper). O tópico "orders" (3 partições) é criado pelo kafka-init.
  # Dois listeners: EXTERNAL (localhost:9092) para a API rodando no host e INTERNAL (kafka:29092) para outros contêineres.
  kafka:
    image: apache/kafka:3.9.0
    container_name: order-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: order-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "orders", "--partitions", "3", "--replication-factor", "1"]
    restart: "no"

  # Interface web para ver tópicos, mensagens e consumer groups do Kafka: http://localhost:8081
  kafbat:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: order-kafbat
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"

  # API (http://localhost:5080/swagger). Para rodá-la fora do Docker (dotnet run), pare este serviço: ambos usam a porta 5080.
  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: order-api
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=OrderAccumulator;User Id=sa;Password=Order@Acc2026!;TrustServerCertificate=True"
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "5080:8080"

  # Formulário web (http://localhost:5173). O nginx repassa /api/* para a API.
  order-generator:
    build:
      context: ./OrderGenerator
    container_name: order-generator
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  sqlserver-data:
  kafka-data:
