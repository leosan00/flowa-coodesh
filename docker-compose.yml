services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Credenciais de desenvolvimento/teste (usuário: sa). Não use em produção.
      MSSQL_SA_PASSWORD: Order@Acc2026!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Cria o banco e aplica o esquema (database/*.sql) e termina. Os scripts são idempotentes: pode rodar quantas vezes quiser.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: Order@Acc2026!
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -i /scripts/01-create-database.sql
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -d OrderAccumulator -i /scripts/02-schema.sql
        echo "Banco OrderAccumulator pronto."
    restart: "no"

volumes:
  sqlserver-data:
